<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--tx:#e9e7df;--dim:#77756d;--ln:#3a3935}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:"VT323","Courier New",monospace;font-size:22px;line-height:1.3}
.screen{display:none;min-height:100vh;padding:26px 22px}
.screen.on{display:block}
.wrap{max-width:720px;margin:0 auto}
pre{margin:0;white-space:pre-wrap}
h1{font-weight:400;font-size:36px;margin:0 0 4px}
.dim{color:var(--dim)}
.row{display:flex;gap:10px;border-bottom:2px solid var(--tx);padding-bottom:6px;margin-top:16px}
.row:focus-within{border-bottom-style:dashed}
#q{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit}
#q:focus{outline:none}
#msg{min-height:1.4em;margin-top:12px}
button{font:inherit;color:var(--tx);background:none;border:2px solid var(--tx);padding:2px 14px;cursor:pointer}
button:hover,button:focus-visible{background:var(--tx);color:var(--bg);outline:none}
.card{display:block;width:100%;text-align:left;margin-top:22px;padding:18px 20px;animation:pop .4s steps(4)}
.card b{display:block;font-weight:400;font-size:64px;line-height:1}
.card i{display:block;font-style:normal;font-size:30px;margin:4px 0 12px}
.card small{display:block;font-size:20px;opacity:.7}
@keyframes pop{from{opacity:0}to{opacity:1}}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--tx);padding-bottom:6px;margin-bottom:18px}
.top h2{margin:0;font-weight:400;font-size:32px}
.grid{display:grid;grid-template-columns:200px minmax(0,1fr) 230px;gap:22px;max-width:1000px;margin:0 auto;align-items:start}
.portrait{width:100%;aspect-ratio:3/4;border:2px solid var(--tx);position:relative;overflow:hidden;background:#0c0c0b}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden}
.portrait img.show{visibility:visible}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);padding:10px;font-size:18px}
#pcode{font-size:38px;margin-top:10px;line-height:1}
#pnick{color:var(--dim)}
.mid{display:flex;flex-direction:column;gap:20px}
.mid h3{margin:0 0 2px;font-weight:400;font-size:26px;text-align:center}
.mid svg{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.vals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px;font-size:18px;max-width:320px;margin:4px auto 0}
.vals b{font-weight:400;float:right}
.vals i{display:inline-block;width:10px;height:10px;margin-right:5px}
.desc{border:2px solid var(--tx);min-height:240px;padding:10px;white-space:pre-wrap}
.desc h4{margin:0 0 6px;font-weight:400;color:var(--dim);font-size:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.portrait{max-width:200px}}
</style>
</head>
<body>

<section id="boot" class="screen on"><pre id="bootlog"></pre></section>

<section id="prompt" class="screen"><div class="wrap">
  <h1>Archive</h1>
  <div class="dim">Type a file name exactly to open it.</div>
  <form id="sf" class="row" autocomplete="off"><span>open&gt;</span><input id="q" type="text" aria-label="File name" spellcheck="false" autocapitalize="off"></form>
  <div id="msg" role="status"></div>
</div></section>

<section id="result" class="screen"><div class="wrap">
  <pre id="rlog" aria-live="polite"></pre>
  <button id="card" class="card" type="button" hidden>
    <small>file found</small><b id="rcode"></b><i id="rnick"></i><small>[ click to open profile ]</small>
  </button>
  <p><button id="rback" type="button">Back</button></p>
</div></section>

<section id="profile" class="screen">
  <div class="top"><h2 id="ptitle"></h2><button id="close" type="button">Close file</button></div>
  <div class="grid">
    <div><div class="portrait" id="portrait"></div><div id="pcode"></div><div id="pnick"></div></div>
    <div class="mid">
      <div><h3>Physical</h3><div id="c1"></div></div>
      <div><h3>Mental</h3><div id="c2"></div></div>
    </div>
    <div class="desc"><h4>Description</h4><div id="desc"></div></div>
  </div>
</section>

<script>
/* ============ EDIT HERE ============
   name: exact text typed to find the file     code / nick: shown after search
   frames: two drawing images (put them in an img folder)   desc: description text (can be empty)
   physical: Speed, Strength, Durability, Height, Stamina, Precision (0-10)
   mental: Cognition, Social, Adaptability, Creativity, Composure, Perception (0-10) */
const FILES = [
  { name:"Sample One", code:"S-01", nick:"The First", frames:["img/sample-one-1.png","img/sample-one-2.png"],
    physical:[7,5,6,4,8,9], mental:[6,7,8,5,4,9], desc:"" },
  { name:"Sample Two", code:"S-02", nick:"The Second", frames:["img/sample-two-1.png","img/sample-two-2.png"],
    physical:[3,8,7,9,6,2], mental:[9,4,5,8,7,6], desc:"" }
];
const PHYS=["Speed","Strength","Durability","Height","Stamina","Precision"];
const MENT=["Cognition","Social","Adaptability","Creativity","Composure","Perception"];
const PCOL=["#ff5d5d","#ff9a3c","#ffd23f","#2ee6c5","#5aa9ff","#b57cff"];
const MCOL=["#a6ff3c","#ff4fd8","#4dffb0","#ff8f6b","#8f9bff","#e8e86a"];
const LEVELS=10, FRAME_MS=550;
/* =================================== */

const $=id=>document.getElementById(id);
const norm=s=>s.trim().replace(/\s+/g," ").toLowerCase();
const show=id=>document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));
const fast=matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,fast?0:ms));
let run=0, timer=null, current=null;

/* boot */
(async()=>{
  for(const l of ["ARCHIVE SYSTEM v1.0","checking memory .......... ok","mounting records ......... ok","balancing karma ... ... ok","","ready."]){ $("bootlog").textContent+=l+"\n"; await sleep(380); }
  await sleep(500); show("prompt"); $("q").focus();
})();

/* scramble text into place */
async function scramble(el,text,ms){
  if(fast){el.textContent=text;return;}
  const set="01#$%&*+=<>?/", t0=performance.now();
  while(true){
    const p=Math.min(1,(performance.now()-t0)/ms), n=Math.floor(p*text.length);
    el.textContent=text.split("").map((c,i)=>i<n||c===" "?c:set[Math.random()*set.length|0]).join("");
    if(p>=1)break; await sleep(40);
  }
}

/* search result animation */
async function reveal(e){
  const id=++run, log=$("rlog"), card=$("card");
  log.textContent=""; card.hidden=true; current=e; show("result");
  const ok=()=>id===run;
  for(const l of ["> locating file ...","> consent verified"]){ if(!ok())return; log.textContent+=l+"\n"; await sleep(450); }
  if(!ok())return; log.textContent+="> decrypting ";
  const base=log.textContent;
  for(let i=1;i<=20;i++){ if(!ok())return; log.textContent=base+"["+"█".repeat(i)+"░".repeat(20-i)+"]"; await sleep(60); }
  if(!ok())return; log.textContent+="\n> done\n"; await sleep(300);
  if(!ok())return; card.hidden=false; card.focus();
  await Promise.all([scramble($("rcode"),e.code,700),scramble($("rnick"),e.nick,900)]);
}

/* wheel */
const C=170,RO=165,RR=130,RI=112,ANG=[-90,-30,30,90,150,210];
const pt=(r,a)=>{const t=a*Math.PI/180;return[C+r*Math.cos(t),C+r*Math.sin(t)]};
const f=n=>n.toFixed(1);
function sector(r1,r2,a1,a2){const[x1,y1]=pt(r2,a1),[x2,y2]=pt(r2,a2),[x3,y3]=pt(r1,a2),[x4,y4]=pt(r1,a1);
  return`M${f(x1)} ${f(y1)}A${r2} ${r2} 0 0 1 ${f(x2)} ${f(y2)}L${f(x3)} ${f(y3)}A${r1} ${r1} 0 0 0 ${f(x4)} ${f(y4)}Z`}
function wheel(labels,vals,cols,pid){
  let s=`<svg viewBox="0 0 340 340" role="img" aria-label="${labels.map((l,i)=>l+" "+vals[i]+" of "+LEVELS).join(", ")}">
  <defs><pattern id="h${pid}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#3a3935" stroke-width="2"/></pattern></defs>
  <circle cx="${C}" cy="${C}" r="${RO}" fill="#080808" stroke="#e9e7df" stroke-width="2"/>
  <circle cx="${C}" cy="${C}" r="${RR}" fill="none" stroke="#e9e7df" stroke-width="1.2"/>`;
  ANG.forEach(a=>s+=`<path d="${sector(RR,RO,a+19,a+41)}" fill="url(#h${pid})" stroke="#3a3935" stroke-width="1.2"/>`);
  s+=`<circle cx="${C}" cy="${C}" r="${RI}" fill="#0c0c0b" stroke="#e9e7df" stroke-width="2.5"/>`;
  const pts=vals.map((v,i)=>pt(RI*Math.max(0,Math.min(LEVELS,v))/LEVELS,ANG[i]));
  ANG.forEach((a,i)=>{
    const[x,y]=pt(RI,a);
    s+=`<line x1="${C}" y1="${C}" x2="${f(x)}" y2="${f(y)}" stroke="#77756d" stroke-width="1.5"/>`;
    for(let n=1;n<=LEVELS;n++){const[px,py]=pt(RI*n/LEVELS,a),t=(a+90)*Math.PI/180,k=n%5?3.5:6;
      s+=`<line x1="${f(px-Math.cos(t)*k)}" y1="${f(py-Math.sin(t)*k)}" x2="${f(px+Math.cos(t)*k)}" y2="${f(py+Math.sin(t)*k)}" stroke="#77756d" stroke-width="1.3"/>`;}
    const[lx,ly]=pt((RR+RO)/2-1,a),rot=Math.sin(a*Math.PI/180)>.01?a-90:a+90;
    s+=`<text transform="translate(${f(lx)} ${f(ly)}) rotate(${rot})" text-anchor="middle" dominant-baseline="central" font-family="VT323,monospace" font-size="19" fill="${cols[i]}">${labels[i]}</text>`;
  });
  s+=`<polygon points="${pts.map(p=>f(p[0])+","+f(p[1])).join(" ")}" fill="rgba(233,231,223,.1)" stroke="rgba(233,231,223,.55)" stroke-width="1.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>s+=`<line x1="${C}" y1="${C}" x2="${f(p[0])}" y2="${f(p[1])}" stroke="${cols[i]}" stroke-width="5" stroke-linecap="round"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="6.5" fill="${cols[i]}"/>`);
  s+=`<circle cx="${C}" cy="${C}" r="5" fill="#e9e7df"/></svg><div class="vals">${labels.map((l,i)=>`<span><i style="background:${cols[i]}"></i>${l}<b>${vals[i]}</b></span>`).join("")}</div>`;
  return s;
}

/* profile */
function openProfile(e){
  $("ptitle").textContent=e.code+" // "+e.name; $("pcode").textContent=e.code; $("pnick").textContent=e.nick;
  $("c1").innerHTML=wheel(PHYS,e.physical,PCOL,"p"); $("c2").innerHTML=wheel(MENT,e.mental,MCOL,"m");
  $("desc").textContent=e.desc||"";
  const box=$("portrait"); box.innerHTML="";
  const imgs=e.frames.map((src,i)=>{const im=new Image();im.alt=i?"":"Drawing of "+e.name;im.src=src;
    im.onerror=()=>{im.remove();if(!box.querySelector("img")&&!box.querySelector(".ph")){const d=document.createElement("div");d.className="ph";d.textContent="no drawing yet";box.appendChild(d);}};
    box.appendChild(im);return im;});
  let k=0; imgs[0].classList.add("show"); clearInterval(timer);
  if(imgs.length>1)timer=setInterval(()=>{imgs[k].classList.remove("show");k=(k+1)%imgs.length;imgs[k].classList.add("show");},FRAME_MS);
  show("profile"); window.scrollTo(0,0); $("close").focus();
}

/* events */
$("sf").addEventListener("submit",ev=>{ev.preventDefault();
  const hit=FILES.find(x=>norm(x.name)===norm($("q").value));
  if(hit){$("msg").textContent="";reveal(hit);} else $("msg").textContent="No file found. Check the exact name and try again.";});
$("card").addEventListener("click",()=>openProfile(current));
const home=()=>{run++;clearInterval(timer);$("q").value="";$("msg").textContent="";show("prompt");$("q").focus();};
$("rback").addEventListener("click",home); $("close").addEventListener("click",home);
</script>
</body>
</html>
